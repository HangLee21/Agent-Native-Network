figure:
  slug: causal-service-diagnostic
  placement: research-stage-report
  target_width_inches: 7
  source_scale: 3
  source_canvas_inches: [21, 16.5]
  source_font_min_pt: 24
  claim: Delivery conditions and shared FIFO service alter realized task trajectories; failures and recovery depend on the common execution rules.
  boundary: Five development seeds per group, fixed nine robots; no proposed algorithm, wireless model, or scalability estimate.
source_data:
  - path: source_data.csv
    role: All 45 main cases and 10 exploratory waiting-limit cases
  - path: profile.json
    role: Input archive hashes, missingness, sample counts and descriptive statistics
panels:
  - id: a
    setup: 15 tasks, waiting limit 200, instant and fixed delay
  - id: b
    setup: 20 tasks, waiting limit 200, instant and fixed delay
  - id: c
    setup: 15 tasks, waiting limit 200, finite shared FIFO
  - id: d
    setup: 15 tasks, waiting limit 20, exploratory recovery sensitivity
encoding:
  x: Physical parameter within each panel; delay zero denotes resource-relaxed instant.
  y: Physical return time; incomplete cases shown as crosses at H=200 on a labelled log axis.
  repeated_instances: Five colors and five marker shapes; same seed only paired within its task count.
  censoring: No line connects through an incomplete case. Tiny deterministic x-offset exposes coincident crosses.
  uncertainty: All individual instances shown, no inferred significance or confidence interval.
script: ../../../../coordination/reviews/M-006-plot.py
validation:
  status: assistant_preview_checked
  preview: preview_final_width.png
