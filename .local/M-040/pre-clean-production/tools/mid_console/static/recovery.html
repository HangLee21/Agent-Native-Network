<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>恢复控制台</title><style>body{font:16px system-ui;max-width:850px;margin:50px auto;padding:20px;background:#f2f6fa;color:#19304d}button{font:inherit;padding:12px;margin:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px}</style><h1>恢复控制台</h1><p>仅核对指定失败运行的清理证据。保留原失败，不重新发送业务。设备仍未确认停止时继续保护。</p><button id="refresh">刷新状态</button><button id="recover" disabled>核对清理并恢复</button><a href="/">返回控制台</a><pre id="state"></pre><script>
let active=null;const view=document.getElementById('state'),button=document.getElementById('recover');async function status(){let s=await(await fetch('/api/status')).json();active=s.active_run_id;button.disabled=!s.recovery_available;view.textContent=JSON.stringify(s,null,2)}document.getElementById('refresh').onclick=()=>status().catch(e=>view.textContent=e.message);button.onclick=async()=>{button.disabled=true;try{let r=await fetch('/api/runs/'+encodeURIComponent(active)+'/recover',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});view.textContent=JSON.stringify(await r.json(),null,2)}catch(e){view.textContent=e.message}};status().catch(e=>view.textContent=e.message);
</script></html>
